services:
  postgres:
    image: postgres:16-alpine
    container_name: spaceproof-postgres
    environment:
      POSTGRES_USER: spaceproof
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: spaceproof
    ports:
      - "5432:5432"
    volumes:
      - spaceproof_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceproof -d spaceproof"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  spaceproof_pg:
